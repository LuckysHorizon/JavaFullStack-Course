<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Fill in the details below to register</p>
    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="3-20 alphanumeric characters">
          <span class="status-icon"></span>
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <span class="status-icon"></span>
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <div class="input-wrapper">
          <input type="tel" id="phone" name="phone" placeholder="10-digit number">
          <span class="status-icon"></span>
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="Min 8 chars, mixed case, number, special">
          <span class="status-icon"></span>
        </div>
        <div class="strength-meter">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <small class="strength-label" id="strengthLabel"></small>
        <small class="error-msg"></small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
          <span class="status-icon"></span>
        </div>
        <small class="error-msg"></small>
      </div>

      <button type="submit" class="submit-btn">Register</button>
      <div id="formMessage" class="form-message hidden"></div>
    </form>
  </div>
  <script src="validator.js"></script>
</body>
</html>
