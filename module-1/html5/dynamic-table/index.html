<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Records</h1>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search by name or email...">
            <button id="addBtn" class="btn-add">+ Add Student</button>
        </div>

        <table id="studentTable">
            <thead>
                <tr>
                    <th data-col="name" class="sortable">Name </th>
                    <th data-col="email" class="sortable">Email </th>
                    <th data-col="grade" class="sortable">Grade </th>
                    <th data-col="status">Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <!-- Add/Edit form (hidden by default) -->
        <div id="formOverlay" class="overlay" hidden>
            <div class="form-modal">
                <h2 id="formTitle">Add Student</h2>
                <form id="studentForm">
                    <input type="hidden" id="editIndex" value="-1">
                    <div class="field">
                        <label for="nameInput">Name</label>
                        <input type="text" id="nameInput" required placeholder="Full name">
                    </div>
                    <div class="field">
                        <label for="emailInput">Email</label>
                        <input type="email" id="emailInput" required placeholder="student@email.com">
                    </div>
                    <div class="field">
                        <label for="gradeInput">Grade</label>
                        <select id="gradeInput">
                            <option>A</option><option>B</option><option>C</option>
                            <option>D</option><option>F</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="statusInput">Status</label>
                        <select id="statusInput">
                            <option>Active</option>
                            <option>Inactive</option>
                            <option>Graduated</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-save">Save</button>
                        <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
