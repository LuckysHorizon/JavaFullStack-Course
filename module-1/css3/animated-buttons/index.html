<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Button Collection</h1>
        <p class="subtitle">CSS-only button animations and effects.</p>

        <section>
            <h2>Gradient Buttons</h2>
            <div class="btn-row">
                <button class="btn gradient-1">Primary</button>
                <button class="btn gradient-2">Sunset</button>
                <button class="btn gradient-3">Ocean</button>
            </div>
        </section>

        <section>
            <h2>Outline Buttons</h2>
            <div class="btn-row">
                <button class="btn outline-fill">Hover to Fill</button>
                <button class="btn outline-slide">Slide Effect</button>
                <button class="btn outline-grow">Border Grow</button>
            </div>
        </section>

        <section>
            <h2>Icon Buttons</h2>
            <div class="btn-row">
                <button class="btn icon-btn">Like</button>
                <button class="btn icon-btn">Favorite</button>
                <button class="btn icon-btn">Share</button>
            </div>
        </section>

        <section>
            <h2>Special Effects</h2>
            <div class="btn-row">
                <button class="btn glow-btn">Neon Glow</button>
                <button class="btn loading-btn">
                    <span class="btn-text">Submit</span>
                    <span class="btn-spinner"></span>
                </button>
                <button class="btn ripple-btn">Ripple</button>
            </div>
        </section>
    </div>
</body>
</html>
